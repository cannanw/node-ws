<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoGuard - Protect Our Environment</title>
    <style>
        :root {
            --primary-green: #2d5a27;
            --accent-green: #4CAF50;
            --bg-light: #f4f7f6;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'PingFang SC'; margin: 0; line-height: 1.6; color: #333; background-color: var(--bg-light); transition: all 0.3s; }
        
        /* Navigation */
        nav { background-color: var(--primary-green); color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.3rem; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .lang-switch { background: white; color: var(--primary-green); border: none; padding: 5px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; }

        /* Hero Section */
        .hero { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1350&q=80'); background-size: cover; background-position: center; height: 40vh; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
        .hero h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }

        /* Quiz Styles */
        .container { max-width: 800px; margin: 2rem auto; padding: 0 20px; }
        .quiz-box { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .question { font-size: 1.2rem; font-weight: bold; margin-bottom: 1.5rem; color: var(--primary-green); }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .opt-btn { padding: 12px 20px; border: 2px solid #eee; border-radius: 8px; background: none; cursor: pointer; text-align: left; transition: 0.2s; }
        .opt-btn:hover { border-color: var(--accent-green); background-color: #f0fdf4; }
        .opt-btn.correct { background-color: #d4edda; border-color: #28a745; color: #155724; }
        .opt-btn.wrong { background-color: #f8d7da; border-color: #dc3545; color: #721c24; }
        
        #feedback { margin-top: 1.5rem; padding: 1rem; border-radius: 8px; display: none; font-size: 0.95rem; }
        .next-btn { margin-top: 1rem; background: var(--primary-green); color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; display: none; }
        
        footer { background-color: #333; color: white; text-align: center; padding: 2rem 0; margin-top: 4rem; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">🌿 <span data-i18n="navTitle">EcoGuard</span></div>
        <button class="lang-switch" onclick="toggleLanguage()">中文 / EN</button>
    </nav>

    <section class="hero">
        <h1 data-i18n="heroTitle">Protect Our Future</h1>
        <p data-i18n="heroSub">Every small action counts for a greener planet.</p>
    </section>

    <div class="container">
        <div class="quiz-box">
            <h2 style="text-align: center; margin-top: 0;" data-i18n="quizTitle">Eco-Knowledge Quiz</h2>
            <div id="quiz-ui">
                <div class="question" id="q-text">Loading...</div>
                <div class="options" id="opt-container"></div>
                <div id="feedback"></div>
                <button class="next-btn" id="next-btn" onclick="nextQuestion()" data-i18n="nextBtn">Next Question</button>
            </div>
            <div id="final-ui" style="display:none; text-align: center;">
                <h3 data-i18n="done">Quiz Completed!</h3>
                <p id="final-score" style="font-size: 1.4rem;"></p>
                <button class="next-btn" style="display:inline-block;" onclick="resetQuiz()" data-i18n="retryBtn">Retry</button>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 EcoGuard Action Group | <span data-i18n="footerText">Protecting the Blue Planet</span></p>
    </footer>

    <script>
        // 1. 语言包配置
        const i18n = {
            en: {
                navTitle: "EcoGuard",
                heroTitle: "Protect Our Future",
                heroSub: "Every small action counts for a greener planet.",
                quizTitle: "Eco-Knowledge Quiz",
                nextBtn: "Next Question",
                done: "Quiz Completed!",
                retryBtn: "Restart",
                footerText: "Protecting the Blue Planet Together",
                correct: "✅ Correct!",
                wrong: "❌ Wrong.",
                scoreMsg: "Your Score: ",
                questions: [
                    { q: "How long does a plastic bag take to decompose?", opts: ["10-20 years", "50 years", "200-500 years", "Forever"], ans: 2, tip: "Plastic bags can take up to 500 years to break down in landfills." },
                    { q: "Which of these is 'Hazardous Waste'?", opts: ["Paper", "Expired Medicine", "Food Waste", "Glass"], ans: 1, tip: "Expired medicines contain chemicals that can harm the environment." }
                ]
            },
            zh: {
                navTitle: "绿色卫士",
                heroTitle: "守护我们的未来",
                heroSub: "每一个微小的行动，都能让地球更绿一点。",
                quizTitle: "环保知识小测试",
                nextBtn: "下一题",
                done: "测试完成！",
                retryBtn: "重新开始",
                footerText: "守护蓝色星球，你我同行",
                correct: "✅ 正确！",
                wrong: "❌ 错误。",
                scoreMsg: "最终得分：",
                questions: [
                    { q: "塑料袋在自然界中降解大约需要多久？", opts: ["10-20年", "50年", "200-500年", "永久"], ans: 2, tip: "解析：普通塑料袋在填埋场中需要长达500年才能降解。" },
                    { q: "下列哪项属于‘有害垃圾’？", opts: ["废纸", "过期药品", "厨余垃圾", "玻璃"], ans: 1, tip: "解析：过期药品含有化学成分，随意丢弃会污染环境。" }
                ]
            }
        };

        let currentLang = 'en';
        let currentIdx = 0;
        let score = 0;

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'zh' : 'en';
            updateStaticText();
            loadQuestion();
        }

        function updateStaticText() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.innerText = i18n[currentLang][key];
            });
        }

        function loadQuestion() {
            const data = i18n[currentLang].questions[currentIdx];
            if (!data) return showResult();

            document.getElementById('q-text').innerText = data.q;
            const container = document.getElementById('opt-container');
            container.innerHTML = '';
            
            data.opts.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAns(i);
                container.appendChild(btn);
            });

            document.getElementById('feedback').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
        }

        function checkAns(idx) {
            const data = i18n[currentLang].questions[currentIdx];
            const btns = document.querySelectorAll('.opt-btn');
            btns.forEach(b => b.disabled = true);

            const feedback = document.getElementById('feedback');
            feedback.style.display = 'block';

            if (idx === data.ans) {
                btns[idx].classList.add('correct');
                feedback.innerText = i18n[currentLang].correct + " " + data.tip;
                score++;
            } else {
                btns[idx].classList.add('wrong');
                btns[data.ans].classList.add('correct');
                feedback.innerText = i18n[currentLang].wrong + " " + data.tip;
            }
            document.getElementById('next-btn').style.display = 'inline-block';
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < i18n[currentLang].questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quiz-ui').style.display = 'none';
            document.getElementById('final-ui').style.display = 'block';
            document.getElementById('final-score').innerText = `${i18n[currentLang].scoreMsg} ${score} / ${i18n[currentLang].questions.length}`;
        }

        function resetQuiz() {
            currentIdx = 0;
            score = 0;
            document.getElementById('quiz-ui').style.display = 'block';
            document.getElementById('final-ui').style.display = 'none';
            loadQuestion();
        }

        // 初始化
        updateStaticText();
        loadQuestion();
    </script>
</body>
</html>
